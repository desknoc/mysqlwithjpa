# Test classpath properties.
# NOTE: this file shadows src/main/resources/application.properties on the test
# classpath. The placeholder keys below are duplicated verbatim from the main file
# so the Phase 1 config contract test (AppConfigurationPropertiesTest) keeps
# reading the same values. Tests that boot a MySQL datasource resolve the real
# coordinates from the Testcontainers @ServiceConnection instead.

spring.application.name=mysqlwithjpa
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}?ssl-mode=${MYSQL_SSL_MODE:REQUIRED}
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.data.mongodb.uri=${MONGODB_URI}
app.logging.mongo.enabled=${MONGO_LOGGING_ENABLED:true}
app.ratelimit.capacity=${RATE_LIMIT_CAPACITY:100}
app.ratelimit.refill-per-minute=${RATE_LIMIT_REFILL_PER_MINUTE:100}

# Test schema initialization: apply schema.sql (with `^` separators so the
# compound IF...END IF trigger body parses as one statement) into the
# Testcontainers MySQL instance before the EntityManagerFactory validates.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.separator=^
