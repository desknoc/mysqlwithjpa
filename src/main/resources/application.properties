spring.application.name=mysqlwithjpa
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.port=8081
spring.datasource.url=jdbc:mysql://localhost:3306/mysqljpa
spring.datasource.username=root
spring.datasource.password=

# Loggers

logging.level.com.sena.mysqlwithjpa=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n
# el logging.pattern.console es para establecer cómo van a ser los logs por defecto (formato)